---
name: Lint and Tests
on:
  push:
    branches:
      - main
      - modernize
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Build documentation
        run: mkdocs build --strict

      - name: Run ruff linter
        run: ruff check .

      - name: Run ruff formatter check
        run: ruff format --check .

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
      postgres:
        image: postgres
        env:
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
          POSTGRES_DB: netbox
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout netbox-healthcheck-plugin
        uses: actions/checkout@v4
        with:
          path: netbox-healthcheck-plugin

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Checkout NetBox
        uses: actions/checkout@v4
        with:
          repository: netbox-community/netbox
          ref: v4.5.2
          path: netbox

      - name: Install netbox-healthcheck-plugin
        working-directory: netbox-healthcheck-plugin
        run: pip install -e ".[test]"

      - name: Install NetBox
        working-directory: netbox
        run: |
          pip install -r requirements.txt

      - name: Configure NetBox
        working-directory: netbox/netbox
        run: |
          cp netbox/configuration_testing.py netbox/configuration.py
          echo "PLUGINS = ['netbox_healthcheck_plugin']" >> netbox/configuration.py
          echo "PLUGINS_CONFIG = {'netbox_healthcheck_plugin': {}}" >> netbox/configuration.py

      - name: Run NetBox migrations
        working-directory: netbox/netbox
        run: python manage.py migrate --no-input

      - name: Run plugin tests
        working-directory: netbox-healthcheck-plugin
        run: pytest -v

      - name: Run NetBox plugin integration tests
        working-directory: netbox/netbox
        run: python manage.py test netbox_healthcheck_plugin.tests --keepdb
